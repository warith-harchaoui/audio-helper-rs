<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="ahr-titre ahr-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ahr-titre">Comment audio-helper-rs fonctionne : un fichier audio en entrée, ffmpeg piloté depuis un Rust typé, des fichiers et du PCM en sortie</title>
  <desc id="ahr-desc">Une planche qui se lit de gauche à droite. Entrée : un fichier audio ou vidéo, désigné par un chemin sur cette machine. Le travail, en trois étapes numérotées : ffprobe répond s'il y a seulement un flux audio puis combien de temps il dure ; ffmpeg décode le résultat en échantillons f32 tenus en mémoire, mono par défaut ; enfin les opérations au niveau fichier coupent, joignent puis comblent sur des horodatages exacts. Sortie : des fichiers écrits à côté de votre entrée, plus des tampons PCM en mémoire. Dessous, un seul crate qui interdit le code unsafe puis documente chaque élément public, pilotant les binaires ffmpeg et ffprobe que vous installez vous-même. On l'atteint par trois surfaces : une API Rust, une ligne de commande clap derrière une option de compilation, puis un skill d'agent. La légende rappelle que rien n'est téléchargé ni ne quitte la machine.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ahr-fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">audio ou vidéo</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">un chemin de fichier</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#ahr-fleche)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="242" y="94" width="214" height="78" rx="10"/>
  <text class="n-title" x="349" y="127" text-anchor="middle">sonder</text>
  <text class="n-sub" x="349" y="146" text-anchor="middle">ffprobe : flux audio, durée</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M460 133 H476" marker-end="url(#ahr-fleche)"/>
  <rect class="stage" x="482" y="94" width="228" height="78" rx="10"/>
  <text class="n-title" x="596" y="127" text-anchor="middle">décoder en PCM</text>
  <text class="n-sub" x="596" y="146" text-anchor="middle">f32 en mémoire, mono par défaut</text>
  <text class="step" x="493" y="110">2</text>
  <path class="flow" d="M714 133 H730" marker-end="url(#ahr-fleche)"/>
  <rect class="stage" x="736" y="94" width="238" height="78" rx="10"/>
  <text class="n-title" x="855" y="127" text-anchor="middle">couper, joindre, combler</text>
  <text class="n-sub" x="855" y="146" text-anchor="middle">tronçons, concat, silence, fond</text>
  <text class="step" x="747" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#ahr-fleche)"/>
  <text class="panel-label" x="1020" y="40">SORTIE</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">fichiers et tampons</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">écrits à côté de l'entrée</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">un seul crate, aucun unsafe, tout documenté</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">ffmpeg et ffprobe dans le PATH — rien d'embarqué</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">API Rust</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, en option)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="608" y="412" text-anchor="middle">Tout tourne sur votre machine. Rien n'est téléchargé ni embarqué : les deux binaires pilotés sont le ffmpeg et le ffprobe que vous avez installés.</text>
</svg>
